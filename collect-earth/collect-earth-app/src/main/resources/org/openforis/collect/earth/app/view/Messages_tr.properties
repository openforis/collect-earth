CloudPlotFile.learningSet=Size atanan {0} parsel dosyası bir öğrenme setidir. Başlamaya hazır olduğunuzda onu Ayarlar > Proje bölümünde, atanmış dosyalarınızın listesinden seçin.
CloudPlotFile.none=Koordinatör size henüz parsel atamadı. Atadığında Ayarlar > Proje bölümünde "Atamaları yenile" düğmesine basın ve parsel dosyanızı seçin.
CloudPlotFile.failed=Size atanan parsel dosyaları bulut sunucusundan alınamadı. Yeniden çevrimiçi olduğunuzda Ayarlar > Proje bölümünü açın, "Atamaları yenile" düğmesine basın ve parsel dosyanızı seçin.
