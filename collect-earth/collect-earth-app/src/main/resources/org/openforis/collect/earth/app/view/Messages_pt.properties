ExternalServicesPanel.viewerHelp.google_earth_pro=As parcelas s\u00e3o carregadas no Google Earth Pro, que tem de estar instalado neste computador. Clique numa parcela no Google Earth para abrir o seu formul\u00e1rio num bal\u00e3o e preencha-o e guarde-o a\u00ed. As imagens hist\u00f3ricas e as outras ferramentas do Google Earth Pro funcionam como habitualmente.
ExternalServicesPanel.viewerHelp.plots_map=O Collect Earth abre o seu pr\u00f3prio mapa numa janela do navegador (Chrome, Edge ou Firefox), com a lista de parcelas, imagens de sat\u00e9lite do motor de imagens do mapa abaixo e o formul\u00e1rio da parcela selecionada ao lado do mapa. N\u00e3o \u00e9 necess\u00e1rio o Google Earth.
ExternalServicesPanel.viewerHelp.google_earth_web=O mapa de parcelas, mais uma segunda janela do navegador com o Google Earth Web (earth.google.com) que voa para cada parcela que selecionar e desenha o seu contorno. Da primeira vez, a Google pode pedir-lhe que aceite os cookies ou que inicie sess\u00e3o nessa janela; o Collect Earth lembra-se disso depois. Estamos a test\u00e1-lo como substituto do Google Earth Desktop.
