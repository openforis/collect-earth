ExternalServicesPanel.viewerHelp.google_earth_pro=Les parcelles sont charg\u00e9es dans Google Earth Pro, qui doit \u00eatre install\u00e9 sur cet ordinateur. Cliquez sur une parcelle dans Google Earth pour ouvrir son formulaire dans une bulle, puis remplissez-le et enregistrez-le l\u00e0. L'imagerie historique et les autres outils de Google Earth Pro fonctionnent comme d'habitude.
ExternalServicesPanel.viewerHelp.plots_map=Collect Earth ouvre sa propre carte dans une fen\u00eatre du navigateur (Chrome, Edge ou Firefox), avec la liste des parcelles, l'imagerie satellite du moteur d'imagerie de la carte ci-dessous et le formulaire de la parcelle s\u00e9lectionn\u00e9e \u00e0 c\u00f4t\u00e9 de la carte. Google Earth n'est pas n\u00e9cessaire.
ExternalServicesPanel.viewerHelp.google_earth_web=La carte des parcelles, plus une deuxi\u00e8me fen\u00eatre du navigateur avec Google Earth Web (earth.google.com) qui vole vers chaque parcelle s\u00e9lectionn\u00e9e et en dessine le contour. La premi\u00e8re fois, Google peut vous demander d'accepter ses cookies ou de vous connecter dans cette fen\u00eatre ; Collect Earth s'en souvient ensuite. Nous le testons pour remplacer Google Earth Bureau.


