ExternalServicesPanel.windowLayoutTooltip=Comment la carte des parcelles et la fen\u00eatre d'imagerie se partagent vos \u00e9crans. Collect Earth l'applique \u00e0 chaque ouverture de fen\u00eatre et quand un \u00e9cran est branch\u00e9 ou d\u00e9branch\u00e9 ; le menu de la carte des parcelles peut l'appliquer de nouveau
