<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collect Earth - Plots Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="map/assets/vendor/leaflet.css">
<link rel="stylesheet" href="map/assets/map.css">
</head>
<body>
<!-- Inline SVG icon sprite (no CDN / icon font: assets must work offline) -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-panel" viewBox="0 0 24 24"><path d="M4 5h16v14H4z M9 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h12M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
</svg>

<div id="layout">
  <aside id="sidebar" aria-label="Plots">
    <header class="sb-header">
      <button id="collapse-btn" class="icon-btn" title="Hide / show the plot list" aria-label="Hide or show the plot list"><svg><use href="#i-panel"/></svg></button>
      <div class="sb-title">
        <h1>Plots</h1>
        <span id="progress-text" class="muted">Loading…</span>
      </div>
    </header>
    <div class="sb-body">
      <div class="progress" aria-hidden="true"><div id="progress-saved"></div><div id="progress-partial"></div></div>

      <label class="search">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
        <input id="filter" type="search" placeholder="Search plot id" aria-label="Search plot id" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>

      <div class="chips" role="radiogroup" aria-label="Show plots">
        <button class="chip" data-filter="all" role="radio">All <span id="count-all" class="count">0</span></button>
        <button class="chip" data-filter="pending" role="radio">To do <span id="count-pending" class="count">0</span></button>
        <button class="chip" data-filter="saved" role="radio">Done <span id="count-saved" class="count">0</span></button>
      </div>

      <button id="next-unfinished" class="btn btn-primary" title="Go to the next plot that is not completed (N)">
        <span>Next unfinished plot</span><kbd>N</kbd>
      </button>

      <ul id="plot-list" role="listbox" aria-label="Plot list" tabindex="0"></ul>
      <p id="list-empty" class="muted list-empty" hidden>No plots match.</p>

      <footer class="legend">
        <span><i class="status-dot status-empty"></i>Not started</span>
        <span><i class="status-dot status-partial"></i>In progress</span>
        <span><i class="status-dot status-saved"></i>Completed</span>
      </footer>
    </div>
  </aside>

  <main id="map-wrap">
    <div id="mapdiv"></div>
    <div id="banner" class="hidden" role="status">
      <span id="banner-text"></span>
      <button id="banner-close" class="icon-btn" aria-label="Dismiss" hidden><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="map-tools">
      <button id="fit-all" class="map-btn" title="Show all plots" aria-label="Show all plots"><svg><use href="#i-fit"/></svg></button>
      <button id="center-active" class="map-btn" title="Center on the selected plot" aria-label="Center on the selected plot" disabled><svg><use href="#i-target"/></svg></button>
    </div>
    <div id="gew-badge" class="map-badge" hidden>
      <svg aria-hidden="true"><use href="#i-globe"/></svg>
      <span>Google Earth Web follows the selected plot</span>
    </div>
  </main>

  <section id="form-panel" class="hidden" aria-label="Plot form">
    <div id="resize-handle" title="Drag to resize"></div>
    <header class="fp-header">
      <button id="form-prev" class="icon-btn" title="Previous plot in the list" aria-label="Previous plot"><svg><use href="#i-left"/></svg></button>
      <div class="fp-title">
        <span id="form-title"></span>
        <span id="form-status" class="pill"></span>
      </div>
      <button id="form-next" class="icon-btn" title="Next plot in the list" aria-label="Next plot"><svg><use href="#i-right"/></svg></button>
      <button id="form-close" class="icon-btn" title="Close the form (Esc)" aria-label="Close the form"><svg><use href="#i-close"/></svg></button>
    </header>
    <iframe id="form-frame" src="about:blank" title="Plot data entry form"></iframe>
  </section>
</div>

<script src="map/assets/vendor/leaflet.js"></script>
<script src="map/assets/engine-leaflet.js"></script>
<script src="map/assets/engine-google.js"></script>
<script src="map/assets/map-core.js"></script>
</body>
</html>
